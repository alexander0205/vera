services:
  postgres:
    image: postgres:17-alpine
    container_name: emitedo_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: emitedo
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "54322:5432"
    volumes:
      - emitedo_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d emitedo"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  emitedo_postgres_data:
