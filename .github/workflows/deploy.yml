name: Deploy

# Un solo workflow, tres jobs en cadena — igual al patrón que ya usan otros
# proyectos del equipo (Validar → Check migraciones → Deploy en un solo run,
# visible de un vistazo en Actions). Dispara directo en cada push a `v2`, no
# depende de que "CI" (que gatea los PRs) haya corrido antes: revalida todo
# de cero sobre el commit que va a producción.
#
# Flujo (ticket Trello "Configurar CI/CD Zero Emite"):
#   1. Validar: mismos checks que en un PR (tipos, pruebas unitarias, build).
#      Si falla, no hay deploy.
#   2. Detectar migraciones pendientes: compara contra el último deploy
#      exitoso. Si el rango trae cambios en lib/db/migrations/, el job
#      `deploy` corre bajo el Environment `production-migration-required`
#      (revisores obligatorios) — alguien debe correr la migración a mano
#      primero (ver docs/deploy-zero.md) y recién ahí aprobar. Sin cambios de
#      DB, corre bajo `Production`, sin revisores, automático.
#   3. Deploy a Vercel: GitHub Actions publica con el CLI de Vercel — nadie
#      del equipo necesita acceso a Vercel para publicar.
on:
  push:
    branches: [v2]

permissions:
  contents: read
  actions: read

concurrency:
  group: deploy-produccion
  cancel-in-progress: false

jobs:
  validar:
    name: Validar (tipos, pruebas, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm exec tsc --noEmit

      - name: Unit tests
        run: pnpm test:unit

      # Build de verificación, no el que se publica — ese lo hace el job
      # "deploy" con las variables reales de Vercel. Acá todo es placeholder.
      - name: Build
        run: pnpm build
        env:
          NEXT_PUBLIC_APP_URL: http://localhost:3000
          AUTH_SECRET: ci-secret-for-build
          POSTGRES_URL: postgresql://ci:ci@localhost:5432/ci
          STRIPE_SECRET_KEY: sk_test_placeholder
          STRIPE_WEBHOOK_SECRET: whsec_placeholder
          STRIPE_PRICE_FREE: price_placeholder
          STRIPE_PRICE_PRO: price_placeholder
          RESEND_API_KEY: re_placeholder
          CRON_SECRET: ci-cron-secret
          PROVIDER_RNC: '000000000'
          PROVIDER_RAZON_SOCIAL: CI Placeholder SRL
          ECF_API_URL: http://ecf-api.invalid
          ECF_API_KEY: ci-placeholder

  migraciones:
    name: Detectar migraciones pendientes
    needs: validar
    runs-on: ubuntu-latest
    outputs:
      hay_migraciones: ${{ steps.detectar.outputs.hay_migraciones }}
      archivos: ${{ steps.detectar.outputs.archivos }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Buscar el último deploy exitoso anterior
        id: buscar
        uses: actions/github-script@v7
        with:
          script: |
            const runs = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'deploy.yml',
              branch: 'v2',
              status: 'success',
              per_page: 1,
            });
            const base = runs.data.workflow_runs[0]?.head_sha ?? '';
            core.setOutput('base_sha', base);
            console.log(base
              ? `Comparando contra el último deploy exitoso: ${base}`
              : 'No hay deploy exitoso previo registrado — se trata como si hubiera migraciones, por seguridad.');

      - name: Correr scripts/ci/detectar-migraciones.sh
        id: detectar
        run: |
          BASE="${{ steps.buscar.outputs.base_sha }}"
          HEAD="${{ github.sha }}"

          if [ -z "$BASE" ]; then
            echo "hay_migraciones=true" >> "$GITHUB_OUTPUT"
            {
              echo "archivos<<EOF_ARCHIVOS"
              echo "(primer deploy registrado — sin base para comparar, se fuerza la revisión)"
              echo "EOF_ARCHIVOS"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          RESULTADO=$(scripts/ci/detectar-migraciones.sh "$BASE" "$HEAD")
          ESTADO=$(echo "$RESULTADO" | head -1)
          ARCHIVOS=$(echo "$RESULTADO" | tail -n +2)

          if [ "$ESTADO" = "hay-migraciones" ]; then
            echo "hay_migraciones=true" >> "$GITHUB_OUTPUT"
          else
            echo "hay_migraciones=false" >> "$GITHUB_OUTPUT"
          fi
          {
            echo "archivos<<EOF_ARCHIVOS"
            echo "$ARCHIVOS"
            echo "EOF_ARCHIVOS"
          } >> "$GITHUB_OUTPUT"

  deploy:
    name: Deploy a Vercel
    needs: migraciones
    runs-on: ubuntu-latest
    environment: ${{ needs.migraciones.outputs.hay_migraciones == 'true' && 'production-migration-required' || 'Production' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Avisar si este deploy trae migraciones
        if: needs.migraciones.outputs.hay_migraciones == 'true'
        env:
          ARCHIVOS: ${{ needs.migraciones.outputs.archivos }}
        run: |
          {
            echo "### ⚠️ Este deploy incluye cambios de base de datos"
            echo '```'
            echo "$ARCHIVOS"
            echo '```'
            echo ""
            echo "Corrió bajo el Environment \`production-migration-required\`, que pide aprobación manual."
            echo "Antes de aprobar: correr la migración a mano. Ver [docs/deploy-zero.md](../../docs/deploy-zero.md#migraciones-de-base-de-datos)."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar Vercel CLI
        run: npm install --global vercel@latest

      - name: Traer configuración de producción de Vercel
        run: vercel pull --yes --environment=production --token="${{ secrets.VERCEL_TOKEN }}"
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Build de producción
        run: vercel build --prod --token="${{ secrets.VERCEL_TOKEN }}"
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Deploy
        id: deploy
        run: |
          URL=$(vercel deploy --prebuilt --prod --token="${{ secrets.VERCEL_TOKEN }}")
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          {
            echo "### ✅ Deploy publicado"
            echo "$URL"
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Si algo falló, cómo revertir
        if: failure()
        run: |
          {
            echo "### ❌ El deploy falló"
            echo "Si falló ANTES del paso Deploy, producción sigue en el deploy anterior — no hay nada que revertir."
            echo "Si falló DESPUÉS de que Deploy imprimió una URL, revertir con el workflow **Rollback a producción** (pestaña Actions → Rollback a producción → Run workflow), pasando esa URL o la del deploy bueno anterior."
            echo "Ver [docs/deploy-zero.md](../../docs/deploy-zero.md#si-algo-sale-mal)."
          } >> "$GITHUB_STEP_SUMMARY"
