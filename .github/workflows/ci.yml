name: CI

# DESACTIVADO (2026-08-03). Solo corre a mano desde la pestaña Actions.
#
# Por qué: llevaba semanas en rojo en todos los PR y en todos los merges a main,
# hasta el punto de que ya nadie lo miraba. Un check que siempre falla no avisa
# de nada y tapa los que sí importan.
#
# Qué lo rompió: `lib/env.ts` exige 9 variables y el paso `Build` de abajo solo
# define 7. Faltan PROVIDER_RNC, PROVIDER_RAZON_SOCIAL, ECF_API_URL y
# ECF_API_KEY, así que `next build` revienta al cargar next.config.ts, antes de
# compilar una sola línea. No es un error del código.
#
# Cómo revivirlo: agregar esas 4 al bloque `env:` del paso `Build` con valores
# placeholder (el build no llama a la DGII, solo valida que existan), y devolver
# los triggers de abajo:
#
#   on:
#     push:
#       branches: [main, develop]
#     pull_request:
#       branches: [main]
#
# Mientras tanto el build real que cuenta es el de Vercel, que sí corre en cada
# PR y en cada push a main.
on:
  workflow_dispatch:

jobs:
  build:
    name: Build & Type Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Get pnpm store directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm exec tsc --noEmit
        env:
          NEXT_PUBLIC_APP_URL: http://localhost:3000

      - name: Build
        run: pnpm build
        env:
          NEXT_PUBLIC_APP_URL: http://localhost:3000
          AUTH_SECRET: ci-secret-for-build
          POSTGRES_URL: postgresql://emitedo:emitedo123@localhost:5432/emitedo
          STRIPE_SECRET_KEY: sk_test_placeholder
          STRIPE_WEBHOOK_SECRET: whsec_placeholder
          STRIPE_PRICE_FREE: price_placeholder
          STRIPE_PRICE_PRO: price_placeholder
          RESEND_API_KEY: re_placeholder
          CRON_SECRET: ci-cron-secret
